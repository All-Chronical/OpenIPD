name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            arch: x64
            runner: ubuntu-24.04
          - os: Windows
            arch: x64
            runner: windows-2025
          - os: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install application and packaging dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Verify dependencies and source syntax
        shell: bash
        run: |
          python -c "import pathlib, py_compile; files=list(pathlib.Path('.').glob('*.py')); [py_compile.compile(str(path), doraise=True) for path in files]"
          python -c "import cv2, mediapipe, numpy; print('Dependencies imported successfully')"

      - name: Build Windows executable bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean OpenIPD.spec
          7z a "dist/OpenIPD-Windows-x64.zip" "dist/OpenIPD/*"

      - name: Build Linux executable bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean OpenIPD.spec
          mkdir -p AppDir/usr/bin/OpenIPD AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -a dist/OpenIPD/. AppDir/usr/bin/OpenIPD/
          cp packaging/openipd.svg AppDir/openipd.svg
          cp packaging/openipd.svg AppDir/usr/share/icons/hicolor/scalable/apps/openipd.svg
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/OpenIPD/OpenIPD" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/bin/OpenIPD/OpenIPD
          cat > AppDir/openipd.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OpenIPD
          Exec=AppRun
          Icon=openipd
          Categories=Utility;
          Terminal=false
          EOF
          cp AppDir/openipd.desktop AppDir/usr/share/applications/openipd.desktop
          sudo apt-get update
          sudo apt-get install -y libfuse2 file
          ARCH="${{ matrix.arch == 'ARM64' && 'aarch64' || 'x86_64' }}"
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage" -o appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ARCH="$ARCH" APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage AppDir "dist/OpenIPD-Linux-${{ matrix.arch }}.AppImage"
          file "dist/OpenIPD-Linux-${{ matrix.arch }}.AppImage"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenIPD-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/OpenIPD-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*